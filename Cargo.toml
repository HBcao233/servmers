[workspace]
members = [
    "servmers",
    "servmers-core",
    "servmers-services",
    "servmers-mtproto",
    "servmers-crypto",
]
resolver = "2"

[workspace.dependencies]
servmers-crypto = { path = "servmers-crypto" }
servmers-mtproto = { path = "servmers-mtproto" }
servmers-services = { path = "servmers-services" }
servmers-core = { path = "servmers-core" }

grammers-crypto = { git = "https://codeberg.org/Lonami/grammers.git", rev = "1e31e73cd9" }
grammers-mtproto = { git = "https://codeberg.org/Lonami/grammers.git", rev = "1e31e73cd9" }
grammers-tl-types = { git = "https://codeberg.org/Lonami/grammers.git", rev = "1e31e73cd9", features = ["tl-mtproto", "deserializable-functions"] }
grammers-mtsender = { git = "https://codeberg.org/Lonami/grammers.git", rev = "1e31e73cd9" }

tracing = "0.1.44"

